[package]
name = "no_std_hello_world"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "no_std_hello_world"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
defmt = "1.0.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.9.1"
embassy-futures = "0.1.2"
esp-alloc = { git = "https://github.com/esp-rs/esp-hal" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", features = [
    "unstable",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", features = [
    "defmt-espflash",
] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", features = [
    "ble",
    "unstable",
    "defmt",
] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", features = [
    "embassy",
    "esp-radio",
] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal" }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "67a7ebb0bc7babd3e882d49e9c2fb05986d322af", features = ["defmt", "security"] }

[features]
default = ["esp32s3"]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-radio/esp32c3",
    "esp-alloc/esp32c3",
    "esp-storage/esp32c3",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-alloc/esp32s3",
    "esp-radio/esp32s3",
    "esp-alloc/esp32s3",
    "esp-storage/esp32s3",
]
