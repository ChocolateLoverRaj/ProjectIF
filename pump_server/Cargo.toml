[package]
name = "no_std_hello_world"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "no_std_hello_world"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
defmt = "1.0.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.9.1"
embassy-futures = "0.1.2"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "0.4.0"
esp-hal = { version = "1.0.0", features = ["defmt", "unstable"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash"] }
esp-radio = { version = "0.17.0", features = ["ble", "defmt", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["defmt", "embassy"] }
esp-storage = "0.8.1"
trouble-host = { git = "https://github.com/embassy-rs/trouble", features = ["defmt", "security"] }

[features]
default = ["esp32s3"]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-radio/esp32c3",
    "esp-alloc/esp32c3",
    "esp-storage/esp32c3",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-alloc/esp32s3",
    "esp-radio/esp32s3",
    "esp-alloc/esp32s3",
    "esp-storage/esp32s3",
]

[patch.crates-io]
esp-alloc =             { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-backtrace =         { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-bootloader-esp-idf ={ git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-hal =               { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-println =           { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-radio =             { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-rtos =              { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
esp-storage =           { git = "https://github.com/esp-rs/esp-hal", rev="94ad74c69ccda9e84272fe4436c69400ce6f09fe" }
